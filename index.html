<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0c0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <title>ARIS — Un recuerdo cada día</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cover-mode">
  <div id="background" class="background" aria-hidden="true"></div>
  <div class="background-shade" aria-hidden="true"></div>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="app">
    <section class="album" aria-label="Álbum de recuerdos">
      <header class="topbar">
        <div>
          <p class="eyebrow">UN RECUERDO CADA DÍA</p>
          <h1 id="nombre">Aris</h1>
        </div>
        <div id="numeroPagina" class="page-number" aria-live="polite">00</div>
      </header>

      <section id="zonaTarjetas" class="card-stage" aria-live="polite">
        <article id="tarjetaAnterior" class="memory-card memory-card--previous" aria-hidden="true"></article>
        <article id="tarjetaSiguiente" class="memory-card memory-card--next" aria-hidden="true"></article>
        <article id="tarjetaActual" class="memory-card memory-card--current"></article>
      </section>

      <div class="album-controls">
        <div id="indicadores" class="indicators" aria-label="Progreso del álbum"></div>
        <p class="gesture-hint"><span class="gesture-line"></span><span id="textoGesto">Desliza hacia arriba</span></p>
      </div>

      <footer id="cuentaAtras" class="countdown" aria-live="polite">
        <span>Quedan</span>
        <strong id="contador">—</strong>
        <span>días para vernos.</span>
      </footer>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
